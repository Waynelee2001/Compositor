name: Integration Source Diagnostics

on:
  push:
    branches: [feat/providers-and-appearance]
    paths: [.github/workflows/source-diagnostics.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Snapshot tracked source only
        run: |
          git archive --format=zip --output=Compositor-source.zip HEAD
          git rev-parse HEAD > SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v7
        with:
          name: compositor-integration-source
          path: |
            Compositor-source.zip
            SOURCE_COMMIT.txt
          retention-days: 1
