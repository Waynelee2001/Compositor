name: Provider Source Checks
on:
  push:
    branches: [feat/providers-and-appearance]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: provider-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Archive tracked source for verification
        run: git archive --format=zip --output=provider-source.zip HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: provider-source
          path: provider-source.zip
          retention-days: 1
