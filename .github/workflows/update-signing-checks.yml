name: Update Signing Setup Checks
on:
  push:
    branches: [feat/in-app-updates]
    paths:
      - scripts/setup_update_signing.swift
      - .github/workflows/update-signing-checks.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: update-signing-setup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Compile owner setup helper
        run: swiftc scripts/setup_update_signing.swift -o /tmp/compositor-signing-setup
      - name: Test bootstrap guards without account, Keychain or network access
        run: /tmp/compositor-signing-setup --self-test
