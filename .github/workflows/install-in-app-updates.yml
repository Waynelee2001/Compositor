name: Apply in-app update integration
on:
  push:
    branches: [feat/in-app-updates]
    paths: [.github/workflows/install-in-app-updates.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply pinned source wiring with Codex-only version scope
        run: |
          python3 - <<'PY'
          import os, subprocess, textwrap
          assert os.environ['GITHUB_REF'] == 'refs/heads/feat/in-app-updates'
          source = subprocess.check_output(['git', 'show', '50fa923961f8f0ad902cab3fb89f71271df54a4f:.github/workflows/install-in-app-updates.yml'], text=True)
          script = textwrap.dedent(source.split("          python3 - <<'PY'\n", 1)[1].rsplit('          PY', 1)[0])
          old = "    assert text.count(old) == 1, 'Expected one source anchor in ' + name\n    path.write_text(text.replace(old, new))"
          new = """    if name == 'Compositor.xcodeproj/project.pbxproj':
                  start = text.index(' C0DE00000000000000000402 ')
                  end = text.index('\\n };', start) + len('\\n };')
                  block = text[start:end]
                  assert block.count(old) == 1, 'Expected one Codex configuration anchor'
                  path.write_text(text[:start] + block.replace(old, new) + text[end:])
              else:
                  assert text.count(old) == 1, 'Expected one source anchor in ' + name
                  path.write_text(text.replace(old, new))"""
          assert script.count(old) == 1
          script = script.replace(old, new)
          compile(script, '<verified-updater-wiring>', 'exec')
          exec(script)
          PY
